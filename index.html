<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Snake</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>Snake</h1>

    <section class="scores" aria-label="Scores">
      <div class="stat"><span class="label">Score</span><span class="value" id="score">0</span></div>
      <div class="stat"><span class="label">Best</span><span class="value" id="best">0</span></div>
      <div class="stat"><span class="label">Level</span><span class="value" id="level">1</span></div>
    </section>

    <div class="board-wrap" id="boardWrap">
      <canvas id="board" width="480" height="480" role="img"
              aria-label="Snake game board"></canvas>
      <div class="overlay" id="overlay" role="status" aria-live="polite">
        <h2 id="overlayTitle">Ready?</h2>
        <p id="overlayText">Press Start or the Space bar.</p>
      </div>
    </div>

    <div class="controls">
      <button type="button" id="startBtn" class="btn primary">Start</button>
      <button type="button" id="pauseBtn" class="btn" disabled>Pause</button>
      <button type="button" id="restartBtn" class="btn">Restart</button>
    </div>

    <!-- On-screen directional pad (shown on touch / small screens) -->
    <div class="dpad" aria-label="Directional controls">
      <button type="button" class="btn dir up"    data-dir="up"    aria-label="Up">в–І</button>
      <button type="button" class="btn dir left"  data-dir="left"  aria-label="Left">в—Ђ</button>
      <button type="button" class="btn dir right" data-dir="right" aria-label="Right">в–¶</button>
      <button type="button" class="btn dir down"  data-dir="down"  aria-label="Down">в–ј</button>
    </div>

    <p class="hint">Arrow keys or WASD to move В· Space to pause</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
